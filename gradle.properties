pluginGroup = com.mythic.localreview
pluginVersion = 0.2.1
pluginName = Local Diff Review

# --- Marketplace listing identity (REQUIRED before signing/publishing; `./gradlew marketplaceReadiness` checks these) ---
# Vendor shown on the plugin page. Email and website must be valid and reachable.
pluginVendorName = Mythic
pluginVendorEmail = mythicmaniac@gmail.com
pluginVendorUrl = https://github.com/MythicManiac
# Public homepage / source repository URL (required because the plugin is open source under Apache-2.0).
pluginUrl = https://github.com/MythicManiac/local-review-plugin

# IDE the plugin is compiled and run against (local PyCharm install; build 262). Override in ~/.gradle/gradle.properties on other machines.
ideLocalPath = C:/Program Files/JetBrains/PyCharm 2025.1.1.1

# The platform ships the Kotlin stdlib; never bundle our own.
kotlin.stdlib.default.dependency = false
org.gradle.jvmargs = -Xmx2g
# Off: the changelog plugin renders change notes via the Project, which the configuration cache cannot serialize.
org.gradle.configuration-cache = false
